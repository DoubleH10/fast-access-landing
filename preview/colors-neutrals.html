<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; }
  .wrap { width: 700px; padding: 24px 28px; background: var(--bg-2); }
  .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; height: 64px; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow-xs); }
  .sw { display: flex; align-items: flex-end; justify-content: flex-start; padding: 8px; font: 500 10px/1 var(--font-mono); }
  .lbl { margin-top: 12px; font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="sw" style="background:#F7F7F4;color:#0D1232">50</div>
      <div class="sw" style="background:#ECECE6;color:#0D1232">100</div>
      <div class="sw" style="background:#D9D9D2;color:#0D1232">200</div>
      <div class="sw" style="background:#B8B8B1;color:#0D1232">300</div>
      <div class="sw" style="background:#8B8B85;color:#fff">400</div>
      <div class="sw" style="background:#5C5C57;color:#fff">500</div>
      <div class="sw" style="background:#3A3A38;color:#fff">600</div>
      <div class="sw" style="background:#1E1E29;color:#fff">700</div>
      <div class="sw" style="background:#0D1232;color:#fff">900</div>
    </div>
    <div class="lbl">Neutral ramp · 50 → 900</div>
  </div>
</body></html>

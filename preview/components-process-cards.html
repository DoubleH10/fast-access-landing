<!doctype html>
<html><head><meta charset="utf-8"><title>Process card</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: #0D1232; }
  .wrap { width: 700px; padding: 24px 28px; display: flex; gap: 14px; }
  .card { flex: 1; padding: 18px; border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; background: rgba(255,255,255,0.02); display: flex; flex-direction: column; gap: 10px; }
  .icon { width: 36px; height: 36px; background: #F15B41; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 20px; height: 20px; color: #fff; }
  .t { font: 600 16px/1.2 var(--font-sans); color: #fff; }
  .d { font: 400 12px/1.4 var(--font-sans); color: rgba(255,255,255,0.65); }
</style></head>
<body><div class="wrap">
  <div class="card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div><div class="t">We Store Your Inventory</div><div class="d">Protect your cargo with state-of-the-art facilities and warehousing.</div></div>
  <div class="card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg></div><div class="t">We Process Your Orders</div><div class="d">Efficient pick &amp; pack to meet your logistics needs.</div></div>
  <div class="card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div><div class="t">We Ship Your Packages</div><div class="d">Multi-carrier routing, tracked from dispatch to door.</div></div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: var(--bg-2); }
  .wrap { width: 700px; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .btn { display: inline-flex; align-items: stretch; font: 600 12px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; border-radius: 10px; overflow: hidden; cursor: pointer; border: 0; }
  .btn-label { padding: 14px 18px; display: flex; align-items: center; }
  .btn-arrow { width: 38px; display: flex; align-items: center; justify-content: center; background: #F15B41; color: #fff; }
  .btn-arrow svg { width: 14px; height: 14px; }
  .primary { background: #0D1232; color: #fff; }
  .primary-light { background: #fff; color: #0D1232; border: 1px solid rgba(13,18,50,0.16); }
  .accent { background: #F15B41; color: #fff; padding: 14px 22px; }
  .ghost { background: transparent; color: #0D1232; padding: 14px 18px; border: 1.5px solid #0D1232; border-radius: 10px; }
</style></head>
<body><div class="wrap">
  <button class="btn primary"><span class="btn-label">Contact us</span><span class="btn-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span></button>
  <button class="btn primary-light"><span class="btn-label">Inquire now</span><span class="btn-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span></button>
  <button class="btn accent">Learn more</button>
  <button class="btn ghost">Inquire now</button>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: var(--bg-2); }
  .wrap { width: 700px; padding: 24px 28px; display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: var(--color-liberty-blue); border: 1px solid rgba(255,255,255,0.06); }
  .n { font: 600 11px/1 var(--font-mono); color: var(--fg-1); }
  .t { font: 500 10px/1 var(--font-sans); letter-spacing: 0.04em; color: var(--fg-3); text-transform: uppercase; }
</style></head>
<body><div class="wrap">
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="n">4</div><div class="t">xs · arrow</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="n">8</div><div class="t">sm · input</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="n">12</div><div class="t">md · button</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="n">16</div><div class="t">lg · card</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="n">24</div><div class="t">xl · hero</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="n">pill</div><div class="t">chips</div></div>
</div></body></html>

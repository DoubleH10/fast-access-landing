<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: var(--bg-2); }
  .wrap { width: 700px; padding: 28px 28px; display: flex; gap: 16px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; }
  .box { width: 96px; height: 64px; background: #fff; border-radius: 10px; }
  .n { font: 600 11px/1 var(--font-mono); color: var(--fg-1); }
  .t { font: 500 10px/1.2 var(--font-sans); color: var(--fg-3); text-align: center; max-width: 96px; }
  .glow { background: #F15B41; box-shadow: 0 0 40px rgba(241, 91, 65, 0.55); }
</style></head>
<body><div class="wrap">
  <div class="item"><div class="box" style="box-shadow:0 1px 2px rgba(13,18,50,0.06)"></div><div class="n">xs</div><div class="t">inputs at rest</div></div>
  <div class="item"><div class="box" style="box-shadow:0 2px 6px rgba(13,18,50,0.06), 0 1px 2px rgba(13,18,50,0.04)"></div><div class="n">sm</div><div class="t">card resting</div></div>
  <div class="item"><div class="box" style="box-shadow:0 8px 24px rgba(13,18,50,0.08), 0 2px 6px rgba(13,18,50,0.04)"></div><div class="n">md</div><div class="t">card hover</div></div>
  <div class="item"><div class="box" style="box-shadow:0 24px 56px rgba(13,18,50,0.14), 0 4px 12px rgba(13,18,50,0.06)"></div><div class="n">lg</div><div class="t">hero image · modal</div></div>
  <div class="item"><div class="box glow"></div><div class="n">glow</div><div class="t">active package · status</div></div>
</div></body></html>

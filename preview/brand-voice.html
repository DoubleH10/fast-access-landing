<!doctype html>
<html><head><meta charset="utf-8"><title>Voice samples</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: var(--bg-2); }
  .wrap { width: 700px; padding: 24px 30px; display: flex; flex-direction: column; gap: 10px; }
  .item { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(13,18,50,0.08); align-items: baseline; }
  .item:last-child { border-bottom: 0; }
  .role { font: 500 10px/1.2 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(13,18,50,0.5); }
  .copy { font: 500 16px/1.3 var(--font-display); letter-spacing: -0.01em; color: #0D1232; }
  .copy.small { font: 400 13px/1.4 var(--font-sans); color: rgba(13,18,50,0.72); }
  .copy.btn { font: 600 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; }
</style></head>
<body><div class="wrap">
  <div class="item"><div class="role">Headline</div><div class="copy">Your unwavering e-commerce ally</div></div>
  <div class="item"><div class="role">Eyebrow</div><div class="copy small">Delivering with Care</div></div>
  <div class="item"><div class="role">Capability</div><div class="copy">We Store Your Inventory</div></div>
  <div class="item"><div class="role">Body</div><div class="copy small">Protect your cargo with state-of-the-art facilities and personal warehousing solutions.</div></div>
  <div class="item"><div class="role">CTA</div><div class="copy btn">Contact Us →</div></div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: var(--bg-2); }
  .wrap { width: 700px; padding: 28px 32px; }
  .specimen { font: 500 80px/1.0 var(--font-display); letter-spacing: -0.02em; color: var(--fg-1); }
  .meta { display: flex; gap: 18px; margin-top: 14px; font: 400 11px/1.4 var(--font-mono); color: var(--fg-3); }
  .meta b { font-weight: 600; color: var(--fg-1); }
</style></head>
<body><div class="wrap">
  <div class="specimen">Move forward.</div>
  <div class="meta"><span><b>Clash Grotesk</b> · Medium 500</span><span>80px</span><span>line-height 110%</span><span>tracking −2%</span></div>
</div></body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; background: var(--bg-2); }
  .wrap { width: 700px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .scale { display: flex; align-items: flex-end; gap: 10px; height: 96px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--color-orange-500); border-radius: 2px; width: 18px; }
  .n { font: 500 10px/1 var(--font-mono); color: var(--fg-3); }
  .nb { font: 600 11px/1 var(--font-mono); color: var(--fg-1); }
  .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body><div class="wrap">
  <div class="lbl">Spacing scale · 4-pt grid</div>
  <div class="scale">
    <div class="step"><div class="bar" style="height:4px"></div><div class="nb">4</div><div class="n">1</div></div>
    <div class="step"><div class="bar" style="height:8px"></div><div class="nb">8</div><div class="n">2</div></div>
    <div class="step"><div class="bar" style="height:12px"></div><div class="nb">12</div><div class="n">3</div></div>
    <div class="step"><div class="bar" style="height:16px"></div><div class="nb">16</div><div class="n">4</div></div>
    <div class="step"><div class="bar" style="height:24px"></div><div class="nb">24</div><div class="n">6</div></div>
    <div class="step"><div class="bar" style="height:32px"></div><div class="nb">32</div><div class="n">8</div></div>
    <div class="step"><div class="bar" style="height:48px"></div><div class="nb">48</div><div class="n">12</div></div>
    <div class="step"><div class="bar" style="height:64px"></div><div class="nb">64</div><div class="n">16</div></div>
    <div class="step"><div class="bar" style="height:80px"></div><div class="nb">80</div><div class="n">20</div></div>
    <div class="step"><div class="bar" style="height:96px"></div><div class="nb">96</div><div class="n">24</div></div>
  </div>
</div></body></html>

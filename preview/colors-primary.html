<!doctype html>
<html><head><meta charset="utf-8"><title>Primary palette</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { display: flex; align-items: center; }
  .swatches { width: 700px; height: 180px; display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .sw { padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .sw-name { font: 500 18px/1 var(--font-display); letter-spacing: -0.01em; }
  .sw-hex { font: 500 13px/1 var(--font-mono); opacity: 0.85; }
  .sw-rgb { font: 400 11px/1.5 var(--font-mono); opacity: 0.7; margin-top: 4px; }
</style></head>
<body>
  <div class="swatches">
    <div class="sw" style="background:#0D1232">
      <div class="sw-name">Liberty Blue</div>
      <div><div class="sw-hex">#0D1232</div><div class="sw-rgb">RGB 13&middot;18&middot;50</div></div>
    </div>
    <div class="sw" style="background:#2D2E75">
      <div class="sw-name">Blue Rose</div>
      <div><div class="sw-hex">#2D2E75</div><div class="sw-rgb">RGB 45&middot;46&middot;117</div></div>
    </div>
    <div class="sw" style="background:#F15B41">
      <div class="sw-name">Orange Soda</div>
      <div><div class="sw-hex">#F15B41</div><div class="sw-rgb">RGB 241&middot;91&middot;65</div></div>
    </div>
  </div>
</body></html>
